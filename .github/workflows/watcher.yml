name: watcher

# One finder pass per run, results committed back to the repo.
# Quality is identical to the local watcher: same flags, same cookie
# capability (via secret), and the scan memory (seen_ledger.json) plus the
# rolling keyword cursor (keyword_cursor.json) persist through git, so every
# run continues exactly where the last one stopped.

"on":
  schedule:
    # Twice hourly at :15 and :45 UTC (passes take ~10-15 min; the concurrency
    # group guarantees they never overlap). GitHub may start runs late.
    - cron: "15,45 * * * *"
  workflow_dispatch: {}  # manual "Run workflow" button for on-demand passes

concurrency:
  group: watcher
  cancel-in-progress: false  # never overlap: overlapping passes corrupt the CSV append

permissions:
  contents: write  # needed to push results back

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so pull --rebase works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install requests

      - name: Run finder pass
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          python roblox_finder.py --no-golden --keyword-mode full --search-pages 3 \
            --sort-pages 30 --keyword-limit 750 --snowball-hops 3 --delay 0.2 --csv \
            --watchlist-file watchlist_history.csv \
            --nodiscord-file nodiscord_history.csv \
            --seed-file watchlist_history.csv --seed-file results_history.csv \
            >> results_history.csv 2>> finder.log
          tail -8 finder.log || true

      - name: Upload full pass log
        # finder.log holds the complete pass output incl. any [429]/[retry]/
        # [500] throttling lines (the Actions log only shows the tail above).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finder-log
          path: finder.log
          retention-days: 7

      - name: Commit results back
        # A pass's findings must never be lost to a mid-run push race (user PC
        # pushes land at any time). Rebase is banned here: it conflicts on
        # append-only data files and strands runners on detached HEAD. Instead:
        # plain push, else union-merge origin's data into ours and land on the
        # fresh tip. ci_merge.py guarantees nothing from either side is dropped.
        if: always()  # even a crashed pass may have produced partial rows
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          for f in results_history.csv watchlist_history.csv nodiscord_history.csv seen_ledger.json keyword_cursor.json; do
            [ -f "$f" ] && git add "$f"
          done
          echo "--- staged changes ---"
          git status --short
          git diff --cached --quiet && echo "RESULT: nothing new, skipping commit" && exit 0
          TS=$(date -u +%Y-%m-%d_%H:%M_UTC)
          git commit -m "watcher pass $TS"
          for i in 1 2 3; do
            if git push; then echo "RESULT: pushed"; exit 0; fi
            echo "push raced (attempt $i); union-merging with origin and retrying"
            git fetch origin
            git reset --soft origin/main
            git reset -q
            python ci_merge.py origin/main
            git commit -m "watcher pass $TS (merged)" || true
          done
          echo "RESULT: push FAILED after retries"; exit 1
